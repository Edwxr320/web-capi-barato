<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="sesion.css">
    <title>capi-Barato</title>
</head>
<body>
    <div class="login-container">
        <form id="login-form">
            <input type="checkbox" class="input-check" id="input-check">
            <label for="input-check" class="toggle">
                <span class="text off">Off</span>
                <span class="text on">On</span>
            </label>
            <div class="login-light"></div>
            <h2>Register</h2>

            <!-- EMAIL -->
            <div class="input-box">
                <span class="icon">
                    <ion-icon name="mail"></ion-icon>
                </span>
                <input type="email" id="email" required>
                <label>Email</label>
                <div class="input-line"></div>
            </div>

            <!-- PASSWORD -->
            <div class="input-box">
                <span class="icon">
                    <ion-icon name="lock-closed"></ion-icon>
                </span>
                <input type="password" id="password" required>
                <label>Password</label>
                <div class="input-line"></div>
            </div>

            <!-- REMEMBER -->
            <div class="remember-forgot">
                <label> 
                    <input type="checkbox">
                    Remember Me
                </label>
                <a href="#">Forgot Password?</a>
            </div>

            <!-- BOTÓN -->
            <button type="submit">CAPI-BARATO</button>

            <div class="register-link">
                <p>Don't have an account? <a href="#">Register</a></p>
            </div>
        </form>
    </div>

    <!-- Iconos -->
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

    <!-- Validación y redirección -->
    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault(); // Previene el envío por defecto

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            // Validar formato de email con expresión regular
            const emailRegex = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;

            if (!email || !password) {
                alert('Por favor completa el email y la contraseña.');
            } else if (!emailRegex.test(email)) {
                alert('Por favor ingresa un email válido.');
            } else {
                // Redirige si todo está bien
                window.location.href = '../index.html';
            }
        });
    </script>
</body>
</html>
