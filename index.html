<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Capi-Barato: celulares, notebooks y televisores al mejor precio.">
    <link rel="icon" href="img/logo/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="img/logo/favicon-32.png">
    <link rel="apple-touch-icon" href="img/logo/apple-touch-icon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./css/estilo.css">
    <title>Capi-Barato</title>
</head>
<body>
    <div class="container">
        <div class="container-header">
            <header class="header">
                <button type="button" class="btn-menu" id="btn-menu-cabecera"
                        aria-expanded="false" aria-controls="menu-cabecera" aria-label="Abrir menú">
                    <i class="bi bi-list" aria-hidden="true"></i>
                </button>

                <div class="container-logo">
                    <a href="index.html" aria-label="Capi-Barato, ir al inicio">
                        <img src="img/logo/capi-barato-logo-horizontal.png" alt="Capi-Barato, tienda online" class="logo">
                    </a>
                </div>

                <form class="container-search" id="form-buscador" role="search">
                    <div class="input input-con-limpiar">
                        <input type="search" id="input-buscador" name="buscar" placeholder="Buscar productos, marcas y modelos" aria-label="Buscar productos, marcas y modelos" autocomplete="off">
                        <button type="button" class="icono-limpiar-busqueda" id="btn-limpiar-busqueda" aria-label="Limpiar búsqueda" hidden>
                            <i class="bi bi-x-circle"></i>
                        </button>
                        <button type="submit" class="icono-busqueda" aria-label="Buscar">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </form>

                <a class="header-carrito" href="carrito.html" aria-label="Ver carrito de compras">
                    <i class="bi bi-cart icono-carrito" aria-hidden="true"></i>
                    <span class="num-en-carrito" id="num-en-carrito">0</span>
                </a>

                <!-- En escritorio este bloque es `display:contents`: sus hijos se colocan
                     directamente en la rejilla del encabezado. En móvil se convierte en el
                     panel desplegable que abre el botón de menú. -->
                <div class="header-menu" id="menu-cabecera">
                    <div class="container-ubicacion">
                        <a href="https://www.google.com/maps?ll=-9.243538,-75.019505&amp;z=2&amp;t=m&amp;hl=es-419&amp;gl=PE&amp;mapclient=embed&amp;q=Per%C3%BA" target="_blank" rel="noopener">
                            <i class="bi bi-geo-alt-fill" aria-hidden="true"></i>
                            <span class="txt-enviar">Enviar a</span>
                            <span class="txt-lugar">Elegir ubicación <i class="bi bi-chevron-down" aria-hidden="true"></i></span>
                        </a>
                    </div>

                    <p class="header-envios">
                        <span class="header-envios-icono"><i class="bi bi-truck" aria-hidden="true"></i></span>
                        <span class="header-envios-txt">
                            <strong>Envíos a todo el Perú</strong>
                            <small>Rápido y seguro</small>
                        </span>
                    </p>

                    <a class="btn-acceso" id="btn-acceso" href="iniciorsesion/iniciarsesion.html">
                        <i class="bi bi-person-fill" aria-hidden="true"></i> Iniciar sesión
                    </a>

                    <div class="header-fila2">
                        <div class="nav-menu">
                            <button class="boton-categoria activo" id="todos">Todos los productos</button>
                            <button class="boton-categoria" id="celulares">Celulares</button>
                            <button class="boton-categoria" id="notebooks">Notebooks</button>
                            <button class="boton-categoria" id="televisores">Televisores</button>
                        </div>

                        <div class="info-user">
                            <a href="iniciorsesion/iniciarsesion.html"><i class="bi bi-person" aria-hidden="true"></i><span class="txt-cuenta">Creá tu cuenta</span></a>
                            <a href="https://forms.gle/uk5osUqwpN9aLhrJ9" target="_blank" rel="noopener"><i class="bi bi-star" aria-hidden="true"></i>Califíquenos</a>
                            <a href="mis-compras.html"><i class="bi bi-bag" aria-hidden="true"></i>Mis Compras</a>
                        </div>
                    </div>
                </div>
            </header>
        </div>

        <noscript>
            <p class="noscript-mensaje">Capi-Barato necesita JavaScript habilitado en tu navegador para mostrar el catálogo de productos.</p>
        </noscript>

        <!-- main - contenedor de productos -->
        <main id="main">
            <h2 class="titulo-seccion" id="titulo-seccion">Todos los productos</h2>

            <div id="contenedor-productos" class="contenedor-productos"></div>

            <div id="sin-resultados" class="sin-resultados" hidden>
                <i class="bi bi-search"></i>
                <p>No encontramos productos para <strong id="texto-busqueda-vacia"></strong></p>
                <button type="button" id="btn-limpiar-busqueda-vacio">Ver todos los productos</button>
            </div>

            <!-- contenedor de detalle de producto visitado: se arma dinámicamente desde main.js -->
            <div class="contenedor-producto-visitado" id="contenedor-producto-visitado"></div>

        </main>
    </div>

    <script src="./js/cabecera.js"></script>
    <script src="./js/carrito-api.js"></script>
    <script src="./js/main.js"></script>
</body>
</html>
